name: Specs

on:
  push:
    branches: [develop, main]
    paths:
      - "spec/**"
      - "tools/validate_specs.py"
      - ".github/workflows/specs.yml"
  pull_request:
    paths:
      - "spec/**"
      - "tools/validate_specs.py"
      - ".github/workflows/specs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/validate_specs.py
