name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build Android APK
        run: gradle -p android :app:assembleDebug
      - name: Stage Android APK
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Netsira-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*

  windows:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet restore desktop/Netsira.Desktop/Netsira.Desktop.csproj
          dotnet publish desktop/Netsira.Desktop/Netsira.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release-assets/windows
          $exe = Get-ChildItem release-assets/windows -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Published Windows executable was not found." }
          Copy-Item $exe.FullName release-assets/Netsira-Windows-x64.exe
          Compress-Archive -Path release-assets/windows/* -DestinationPath release-assets/Netsira-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release-assets/Netsira-Windows-x64.exe
            release-assets/Netsira-Windows-x64.zip

  web:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Package web build
        run: |
          cd dist
          zip -r ../Netsira-Web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: web/Netsira-Web.zip

  release:
    if: contains(github.event.head_commit.message, '[release]')
    needs: [android, windows, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"
          gh release create "$TAG" release-assets/*             --target "$GITHUB_SHA"             --title "Netsira $TAG"             --prerelease             --notes "Phase 1–3 preview release.

          Includes:
          - Android debug APK
          - Windows x64 direct EXE
          - Windows x64 ZIP package
          - Static Web build
          - SHA256 checksums

          Current native device integration is read-only. Phase 4–6 development continues on develop."
