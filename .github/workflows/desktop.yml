name: Desktop

on:
  push:
    branches: [develop, main]
    paths:
      - "desktop/**"
      - "global.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "global.json"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore desktop/Netsira.Desktop/Netsira.Desktop.csproj
      - run: dotnet build desktop/Netsira.Desktop/Netsira.Desktop.csproj -c Release --no-restore
